<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VEYA">
  <defs>
    <radialGradient id="sidebarGlow" cx="15%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- רקע: ריבוע פינות מעוגלות, בדיוק כמו רקע סרגל הצד במערכת (charcoal חם + זוהר זהב עדין) -->
  <rect width="512" height="512" rx="112" fill="#2B2620"/>
  <rect width="512" height="512" rx="112" fill="url(#sidebarGlow)"/>

  <!-- טבעת חיצונית + טבעת פנימית דקה — שיחזור מדויק של .auth-monogram מ-App.css -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#C9A227" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#C9A227" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- יהלום יחיד בשעה 12, מתאר בלבד (לא מלא) -->
  <path d="M256 41.5 L275.5 61 L256 80.5 L236.5 61 Z" fill="none" stroke="#C9A227" stroke-width="2.5"/>

  <!-- האות V, גופן סריפי תואם למותג -->
  <text x="256" y="256" dy="-8" text-anchor="middle" dominant-baseline="central"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="209" font-weight="500" fill="#E4C96B">V</text>
</svg>
