<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VEYA">
  <defs>
    <radialGradient id="veyaGlow" cx="15%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- רקע: ריבוע פינות מעוגלות, כמו הפאנל הכהה של סרגל הצד (charcoal חם + זוהר זהב עדין) -->
  <rect width="512" height="512" rx="112" fill="#2B2620"/>
  <rect width="512" height="512" rx="112" fill="url(#veyaGlow)"/>

  <!-- טבעת אחת, מלאה ומוצקה — עוברת נקי בגדלים קטנים (טאב, אייקון אפליקציה) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#C9A227" stroke-width="12"/>

  <!-- יהלום מלא בשעה 12, יושב על קו הטבעת; הילה חומה מפרידה אותו מהטבעת -->
  <path d="M256 34 L288 68 L256 102 L224 68 Z" fill="#2B2620"/>
  <path d="M256 44 L281 68 L256 92 L231 68 Z" fill="#C9A227"/>

  <!-- האות V — Cormorant Garamond, הלוגוטייפ של VEYA -->
  <text x="256" y="256" dy="-6" text-anchor="middle" dominant-baseline="central"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="256" font-weight="600" fill="#E4C96B">V</text>
</svg>
