<!doctype html>
<!--
  מחולל אייקוני המותג של VEYA — מקור אמת להפקה חוזרת.

  הרעיון: לא "לצייר מחדש" את הלוגו, אלא לרסטר (raster) את הקובץ הקיים
  frontend/public/favicon.svg — הטבעת, היהלום והרקע מגיעים 1:1 מה-SVG.
  רק האות V מצוירת בנפרד על קנבס, כדי שתיטען בגופן המותג האמיתי
  (Cormorant Garamond מ-Google Fonts) ולא ב-fallback של סריף כללי.
  כל הפרמטרים של ה-V (מיקום, font-size, font-weight, fill) נשלפים
  אוטומטית מתוך אלמנט ה-<text> של favicon.svg — אין כפילות ואין דריפט.

  favicon.svg מעוצב במכוון עם טבעת אחת עבה ויהלום מלא (ולא טבעת כפולה
  דקה): קווי שיער נעלמים / מטשטשים בגדלים קטנים (טאב, אייקון אפליקציה
  באייפון ~120px). הלוגו המלא עם הטבעת הכפולה נשאר ב-og-image.png ובתוך
  המערכת (.auth-monogram), שם הוא נטען בגודל גדול.

  הרצה: מגישים את התיקייה הזו + עותק של favicon.svg משרת מקומי כלשהו
  (python3 -m http.server), פותחים את הקובץ, ושומרים כל קנבס אל
  frontend/public/:
    apple-touch-icon.png · icon-192.png · icon-512.png · favicon-96x96.png

  og-image.png לא מיוצר כאן — הקובץ הקיים (הלוגו המלא על רקע חום) נשאר.
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>VEYA icon renderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  body { background:#111; color:#eee; font-family:system-ui, sans-serif; margin:16px; }
  canvas { image-rendering:pixelated; background:#333; margin:6px; vertical-align:top; }
  .row { display:flex; flex-wrap:wrap; align-items:flex-start; }
  figure { margin:0 12px 12px 0; }
  figcaption { font-size:12px; }
</style>
</head>
<body>
<h1>VEYA icon renderer</h1>
<div id="stage" class="row"></div>
<script>
// authoring box of favicon.svg
const U = 512;

let svgNoText = null;                 // favicon.svg source, minus its <text> element
let V = null;                         // the V's params, parsed straight out of favicon.svg

async function loadSvg() {
  const raw = await (await fetch('/favicon.svg')).text();
  const m = raw.match(/<text[\s\S]*?>\s*V\s*<\/text>/);
  const t = m ? m[0] : '';
  const attr = (n, d) => { const r = t.match(new RegExp(n + '="([^"]+)"')); return r ? r[1] : d; };
  V = {
    x: parseFloat(attr('x', 256)),
    y: parseFloat(attr('y', 256)),
    dy: parseFloat(attr('dy', 0)),
    size: parseFloat(attr('font-size', 209)),
    weight: attr('font-weight', '500'),
    fill: attr('fill', '#E4C96B'),
  };
  // strip the <text>…</text> (the V) — we redraw it below with the real webfont
  svgNoText = raw.replace(/<text[\s\S]*?<\/text>/g, '');
}

function svgImage(svgText) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([svgText], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

// draw favicon.svg (minus V) + the V, into a `size` px square.
// fullBleed=true first paints the whole square with the favicon brown so the
// rounded-rect corners of favicon.svg become brown-on-brown (for app icons
// added to a home screen, where transparent corners would go black).
async function paintIcon(ctx, size, fullBleed) {
  const unit = size / U;
  if (fullBleed) {
    ctx.fillStyle = '#2B2620'; // favicon.svg background rect fill
    ctx.fillRect(0, 0, size, size);
  }
  const img = await svgImage(svgNoText);
  ctx.drawImage(img, 0, 0, size, size);

  // V — same geometry as favicon.svg (text-anchor:middle, dominant-baseline:central)
  ctx.fillStyle = V.fill;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = V.weight + ' ' + (V.size * unit) + "px 'Cormorant Garamond', Georgia, 'Times New Roman', serif";
  ctx.fillText('V', V.x * unit, (V.y + V.dy) * unit);
}

async function makeCanvas(size, fullBleed) {
  const SS = 4;
  const big = document.createElement('canvas');
  big.width = big.height = size * SS;
  await paintIcon(big.getContext('2d'), size * SS, fullBleed);

  const out = document.createElement('canvas');
  out.width = out.height = size;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(big, 0, 0, size, size);
  return out;
}

const RESULTS = {};
function register(name, canvas) {
  RESULTS[name] = canvas.toDataURL('image/png');
  const fig = document.createElement('figure');
  const cap = document.createElement('figcaption');
  cap.textContent = name + '  (' + canvas.width + ')';
  canvas.style.width = Math.min(canvas.width, 200) + 'px';
  canvas.style.height = 'auto';
  fig.appendChild(canvas);
  fig.appendChild(cap);
  document.getElementById('stage').appendChild(fig);
}

async function run() {
  await loadSvg();
  await document.fonts.load((V.weight || 500) + " 200px 'Cormorant Garamond'");
  await document.fonts.ready;

  // browser tab fallback — identical to favicon.svg (transparent corners kept)
  register('favicon-96x96.png', await makeCanvas(96, false));
  // home-screen / PWA — same artwork, corners filled brown
  register('apple-touch-icon.png', await makeCanvas(180, true));
  register('icon-192.png', await makeCanvas(192, true));
  register('icon-512.png', await makeCanvas(512, true));

  window.__READY__ = true;
  document.title = 'READY';
}
run();
</script>
</body>
</html>
